<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Číslokop — ikona</title>
<!-- Předloha ikony aplikace. Otevři v okně 512×512 a vyfoť (viz README),
     pak zmenši na 192 a 180 px do složky icons/. -->
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: linear-gradient(#58b4f0 40%, #bfe6ff 78%); }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 128px; image-rendering: pixelated;
    background-image: var(--t-grass), var(--t-dirt); background-size: 64px 64px; background-repeat: repeat-x, repeat; }
  .px { position: absolute; image-rendering: pixelated; background-size: 100% 100%; }
  .hero { left: 166px; bottom: 124px; width: 180px; height: 240px; background-image: var(--s-hero); }
  .gem { left: 352px; bottom: 150px; width: 90px; height: 81px; background-image: var(--s-gem); }
  .num { position: absolute; left: 62px; top: 150px; font: 900 110px ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
    color: #ffd23f; text-shadow: 5px 5px 0 #b9772a, 10px 10px 0 #2b2b3a; }
</style>
</head>
<body>
<div class="bg"></div><div class="ground"></div>
<div class="num">+</div>
<div class="px hero"></div><div class="px gem"></div>
<script src="../js/util.js"></script>
<script src="../js/art.js"></script>
<script>MM.art.init();</script>
</body>
</html>
